<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Material+Symbols+Outlined:wght,FILL@400,0..1&display=swap" rel="stylesheet">
<style>
:root{--bg:#090B12;--s1:#121622;--s2:#1B2030;--vio:#8B5CF6;--vio-l:#d0bcff;--lime:#B7F56A;--em:#10B981;--amb:#F59E0B;--red:#F43F5E;--tx:#F8FAFC;--mut:#9CA3AF;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:14px/20px Inter,sans-serif;max-width:560px;margin:auto;padding:72px 16px 96px}
h1,h2,h3,button,.h{font-family:'Plus Jakarta Sans',sans-serif}
.ms{font-family:'Material Symbols Outlined';font-size:20px;line-height:1;vertical-align:middle;font-weight:400}
button{cursor:pointer;color:inherit;border:0;background:none;font-size:inherit}
button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--vio-l);outline-offset:2px}
header,nav{position:fixed;left:0;right:0;margin:auto;max-width:560px;z-index:9;background:rgba(18,22,34,.75);backdrop-filter:blur(16px)}
header{top:0;height:56px;padding:0 16px;display:flex;align-items:center;justify-content:space-between}
nav{bottom:0;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11px;font-weight:600;padding:6px}
nav button.on{color:var(--vio-l)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--s1);border:1px solid var(--line);color:var(--mut);font-weight:600;font-size:12px}
.chip.on{background:var(--vio);color:#fff;border-color:var(--vio)}
.btn{background:var(--vio);color:#fff;border-radius:99px;padding:9px 18px;font-weight:700;box-shadow:0 8px 32px -4px rgba(139,92,246,.28)}
.btn.lime{background:var(--lime);color:var(--bg);box-shadow:none}
.btn.wa{background:#059669;border-radius:12px;width:100%;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font:700 10px/14px 'Plus Jakarta Sans';text-transform:uppercase;background:rgba(183,245,106,.1);color:var(--lime)}
.badge.red{background:rgba(244,63,94,.12);color:var(--red)}
input,textarea,select{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:11px 12px;font:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(139,92,246,.2);outline:0}
textarea{background:none;border:0;resize:none;padding:4px 0}
textarea:focus{box-shadow:none}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.mut{color:var(--mut)}.sm{font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{padding:0;overflow:hidden;margin:0}.item .pic{height:110px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,var(--s2),#251b45)}
.item .b{padding:12px;display:grid;gap:4px}
.opt{position:relative;overflow:hidden;background:var(--s2);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt i{position:absolute;inset:0 auto 0 0;background:rgba(139,92,246,.25);transition:width .4s}
.opt span{position:relative;display:flex;justify-content:space-between}
.sw{width:46px;height:26px;border-radius:99px;background:var(--s2);border:1px solid var(--line);position:relative;flex:none}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on{background:var(--lime)}.sw.on:after{left:22px;background:var(--bg)}
.gpa{display:grid;grid-template-columns:1fr 70px 90px 28px;gap:8px;align-items:center;margin-bottom:8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--s2);border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:560px;display:grid;gap:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--lime);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:30}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <b class="h" style="font-size:18px">Campus<span style="color:var(--vio-l)">X</span></b>
  <button class="chip" id="campus"><span class="ms" style="color:var(--lime);font-size:12px">circle</span> UNILAG (Akoka)</button>
  <span class="ms mut">notifications</span>
</header>
<main id="app"></main>
<nav id="nav"></nav>

<script>
/* ============ 1. DATA LAYER ============
   Every request to your backend lives in this one object. */
const token = { get: () => localStorage.getItem('cx_token'), set: t => localStorage.setItem('cx_token', t), clear: () => localStorage.removeItem('cx_token') };
const prefs = { // phone-only settings; move these to the backend later
  get: () => ({anon: true, waVisible: true, notif: {exam: true, gist: true, buyer: true}, ...JSON.parse(localStorage.getItem('cx_prefs') || '{}')}),
  set: p => localStorage.setItem('cx_prefs', JSON.stringify(p))
};
async function call(path, method = 'GET', body) {
  const res = await fetch('/api' + path, { method, body: body ? JSON.stringify(body) : undefined,
    headers: {'Content-Type': 'application/json', ...(token.get() ? {Authorization: 'Bearer ' + token.get()} : {})} });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token.get()) { token.clear(); render(); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong. Try again.');
  return data;
}
const PAPERS = [
  {t:'MTH 101 Past Questions (2018-2023)', m:'General Math • 14.2 MB • Solved CBT'},
  {t:'GST 102 Summary Notes & Cheat Sheet', m:'Philosophy & Logic • 4.8 MB'},
  {t:'CHM 101 General Chemistry CBT Drill', m:'500 Mock Questions'},
  {t:'CPE 401 Signals & Systems Notes', m:'Engineering • 9.1 MB'}
];
const api = {
  login: (email, password) => call('/auth/login', 'POST', {email, password}),
  register: b => call('/auth/register', 'POST', b),
  me: () => call('/me'),
  saveMe: b => call('/me', 'PUT', b),
  posts: () => call('/posts'),
  addPost: b => call('/posts', 'POST', b),
  likePost: id => call(`/posts/${id}/like`, 'POST'),
  poll: () => call('/poll'),
  vote: (pollId, optionId) => call('/poll/vote', 'POST', {pollId, optionId}),
  listings: () => call('/listings'),
  myListings: () => call('/my/listings'),
  addListing: b => call('/listings', 'POST', b),
  courses: () => call('/courses'),
  saveCourses: c => call('/courses', 'PUT', c),
  papers: async () => PAPERS
};

/* ============ 2. HELPERS ============ */
const $ = s => document.querySelector(s);
const naira = n => '₦' + n.toLocaleString('en-NG');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = n => `<span class="ms">${n}</span>`;
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 1800) };
const sheet = html => { const s = document.createElement('div'); s.className = 'sheet'; s.innerHTML = `<div>${html}</div>`; s.onclick = e => { if (e.target === s) s.remove() }; document.body.append(s); return s };
const ago = s => { const m = Math.floor((Date.now() - new Date(s.replace(' ', 'T') + 'Z')) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago' };
const GRADES = {A:5, B:4, C:3, D:2, E:1, F:0};
const ui = {tab:'feed', feedFilter:'Trending', cat:'All', q:'', pq:'', incognito:true, authMode:'login'};

/* ============ 3. SCREENS ============ */
function pollCard(p) {
  if (!p) return '';
  const total = p.options.reduce((a, o) => a + o.votes, 0), voted = p.votedOption != null;
  return `<div class="card"><span class="badge">Daily campus poll</span>
  <h3 style="margin-top:8px;font-size:17px">${esc(p.question)}</h3>
  ${p.options.map(o => { const pct = Math.round(o.votes / Math.max(1, total) * 100); return `<div class="opt" data-vote="${o.id}" data-poll="${p.id}"><i style="width:${voted ? pct : 0}%"></i><span><b>${esc(o.text)}</b>${voted ? `<b>${pct}%</b>` : ''}</span></div>` }).join('')}
  <p class="mut sm" style="margin-top:10px">${total} ${total === 1 ? 'student has' : 'students have'} voted${voted ? '' : ' • tap an option to vote'}</p></div>`;
}
async function feed() {
  const [posts, poll] = await Promise.all([api.posts(), api.poll()]);
  const list = ui.feedFilter === 'Latest' ? [...posts].sort((a, b) => b.id - a.id) : ui.feedFilter === 'Trending' ? [...posts].sort((a, b) => b.likes - a.likes) : posts;
  return `
  <div class="chips">${['Trending','Latest','Following'].map(f => `<button class="chip ${ui.feedFilter===f?'on':''}" data-filter="${f}">${f}</button>`).join('')}</div>
  <div class="card">
    <div class="row sb"><button class="badge" id="incog" style="${ui.incognito?'':'background:var(--s2);color:var(--mut)'}">Incognito ${ui.incognito?'on':'off'}</button><span class="mut sm">Akoka Buzz</span></div>
    <textarea id="compose" rows="2" placeholder="Abeg drop the gist or confession..."></textarea>
    <div class="row sb"><span class="mut">${ico('add_photo_alternate')} ${ico('poll')} ${ico('tag')}</span><button class="btn" id="post">Post</button></div>
  </div>
  ${pollCard(poll)}
  ${list.map(p => `<article class="card">
    <div class="row"><span class="ms" style="color:var(--vio-l)">${p.anon?'theater_comedy':'account_circle'}</span><div><b class="h">${esc(p.name)}</b> <span class="sm" style="color:var(--lime)">UNILAG</span><div class="mut sm">${ago(p.created_at)}</div></div></div>
    <p style="margin:10px 0;font-size:16px;line-height:24px">${esc(p.text)}</p>
    <div class="sm" style="color:var(--vio-l)">${p.tags.map(esc).join(' ')}</div>
    <div class="row mut" style="margin-top:10px;gap:20px"><button data-like="${p.id}" style="color:${p.liked?'var(--red)':'inherit'}">${ico('favorite')} ${p.likes}</button></div>
  </article>`).join('')}`;
}

async function market() {
  const all = await api.listings();
  const cats = ['All','Phones','Laptops','Books','Hostel'];
  const list = all.filter(l => (ui.cat === 'All' || l.cat === ui.cat) && l.title.toLowerCase().includes(ui.q.toLowerCase()));
  return `
  <input id="msearch" placeholder="Search laptops, textbooks, phones..." value="${esc(ui.q)}" style="margin-bottom:12px">
  <div class="chips">${cats.map(c => `<button class="chip ${ui.cat===c?'on':''}" data-cat="${c}">${c}</button>`).join('')}</div>
  <div class="card row sb"><div><span class="badge">0% commission</span><h2 style="font-size:20px;margin:4px 0">Your Campus Plug 🔌</h2><p class="mut sm">Sell unused gear to verified coursemates.</p></div><button class="btn lime" id="sell">Sell item</button></div>
  <div class="row sb" style="margin-bottom:10px"><h2 style="font-size:18px">Trending on campus</h2><span class="badge">${list.length} live</span></div>
  ${list.length ? `<div class="grid">${list.map(l => `<div class="card item">
    <div class="pic">${l.icon}</div>
    <div class="b"><span class="badge" style="width:fit-content">${esc(l.cond)}</span><b class="h">${esc(l.title)}</b>
    <b class="h" style="font-size:17px">${naira(l.price)}</b><span class="mut sm">${ico('location_on')} ${esc(l.location)}</span><span class="mut sm">${esc(l.seller)}</span>
    <div class="row"><a href="https://wa.me/${l.phone}?text=${encodeURIComponent('Hi, is the ' + l.title + ' still available on CampusX?')}" target="_blank" rel="noopener" style="flex:1;text-decoration:none"><button class="btn wa">WhatsApp</button></a></div></div></div>`).join('')}</div>`
  : `<div class="card" style="text-align:center"><b class="h">Nothing matches yet</b><p class="mut sm">Try another search, or list the item yourself.</p></div>`}
  <div class="card" style="margin-top:12px"><b class="h">${ico('shield')} Safe trade tip</b><p class="mut sm">Inspect items and meet at well-lit hubs like the SUB or Main Library foyer in daylight. Never send advance fees.</p></div>`;
}

async function academics() {
  const [courses, papers] = await Promise.all([api.courses(), api.papers()]);
  const BASE = {units:124, qp:548.0};
  const u = courses.reduce((a, c) => a + +c.unit, 0), pts = courses.reduce((a, c) => a + c.unit * c.grade, 0);
  const gpa = u ? pts / u : 0, cgpa = (BASE.qp + pts) / (BASE.units + u), cur = BASE.qp / BASE.units;
  const shown = papers.filter(p => p.t.toLowerCase().includes(ui.pq.toLowerCase()));
  return `
  <div class="card"><span class="mut sm">Cumulative CGPA</span>
    <div class="h" style="font-size:40px;font-weight:800">${cur.toFixed(2)}<span class="mut" style="font-size:16px"> / 5.00</span></div>
    <div style="height:8px;border-radius:9px;background:var(--s2);margin:8px 0"><div style="height:100%;width:${Math.min(100, cur / 5 * 100)}%;border-radius:9px;background:var(--vio)"></div></div>
    <p class="mut sm">${BASE.units} units passed • ${BASE.qp.toFixed(1)} quality points</p></div>
  <div class="card">
    <div class="row sb"><h2 style="font-size:18px">Semester GPA calculator</h2><button class="mut sm" id="reset">Reset</button></div>
    <p class="mut sm" style="margin:6px 0 12px">A=5 B=4 C=3 D=2 E=1 F=0</p>
    ${courses.map((c, i) => `<div class="gpa"><div><b class="h">${esc(c.code)}</b><div class="mut sm">${esc(c.name)}</div></div>
      <select data-unit="${i}" aria-label="Units">${[1,2,3,4,5,6].map(n => `<option ${n==c.unit?'selected':''}>${n}</option>`).join('')}</select>
      <select data-grade="${i}" aria-label="Grade">${Object.entries(GRADES).map(([g, v]) => `<option value="${v}" ${v==c.grade?'selected':''}>${g} (${v})</option>`).join('')}</select>
      <button data-del="${i}" class="mut" aria-label="Remove">${ico('close')}</button></div>`).join('')}
    <button class="btn lime" id="addc" style="width:100%;margin:6px 0 12px">Add course</button>
    <div class="card" style="background:var(--bg);margin:0"><div class="row sb"><div class="mut sm">${u} units • ${pts} points</div><div style="text-align:right"><div class="sm" style="color:var(--lime)">Projected GPA</div><div class="h" style="font-size:32px;font-weight:800;color:var(--lime)">${gpa.toFixed(2)}</div></div></div>
    <p class="sm" style="margin-top:8px">New cumulative CGPA: <b>${cgpa.toFixed(2)}</b> <span class="mut">(${cgpa >= cur ? '+' : ''}${(cgpa - cur).toFixed(2)})</span></p></div>
  </div>
  <div class="card"><h2 style="font-size:18px;margin-bottom:10px">Past questions & notes</h2>
    <input id="psearch" placeholder="Search past questions..." value="${esc(ui.pq)}" style="margin-bottom:10px">
    ${shown.map(p => `<div class="row sb" style="background:var(--s2);border-radius:14px;padding:12px;margin-bottom:8px"><div><b class="h">${esc(p.t)}</b><div class="mut sm">${esc(p.m)}</div></div><button data-dl="${esc(p.t)}">${ico('download')}</button></div>`).join('') || '<p class="mut sm">No files match that search.</p>'}
  </div>`;
}

async function profile() {
  const [u, l, c] = await Promise.all([api.me(), api.myListings(), api.courses()]), pf = prefs.get();
  const sw = (k, on) => `<button class="sw ${on?'on':''}" data-sw="${k}" role="switch" aria-checked="${on}"></button>`;
  const ck = k => `<label class="row sb" style="padding:8px 0"><span>${{exam:'Exam & test reminders',gist:'Gist replies & mentions',buyer:'Marketplace buyer inquiries'}[k]}</span><input type="checkbox" data-ck="${k}" ${pf.notif[k]?'checked':''} style="width:20px;height:20px;accent-color:var(--vio)"></label>`;
  return `
  <div class="card"><div class="row sb"><span class="ms" style="font-size:56px;color:var(--vio-l)">account_circle</span><button class="btn" id="edit">Edit profile</button></div>
    <h1 style="font-size:24px">${esc(u.name)} ${ico('verified')}</h1><p class="mut">@${esc(u.handle)}${u.dept ? ' • ' + esc(u.dept) : ''}</p><p style="margin-top:8px">${esc(u.bio || 'Add a short bio with Edit profile.')}</p></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
    ${[[l.length, 'Active listings', 'var(--vio-l)'], [c.length, 'Courses added', 'var(--lime)'], [u.role, 'Account type', 'var(--em)']].map(s => `<div class="card" style="text-align:center;margin:0;padding:12px"><div class="h" style="font-size:22px;font-weight:800;color:${s[2]}">${s[0]}</div><div class="mut sm">${s[1]}</div></div>`).join('')}</div>
  <h2 style="font-size:17px;margin:4px 0 8px">Your listings (${l.length})</h2>
  ${l.slice(0, 3).map(x => `<div class="card row sb" style="padding:12px"><div><span class="badge">Active</span><div class="h"><b>${esc(x.title)}</b></div><b style="color:var(--lime)">${naira(x.price)}</b></div><span style="font-size:28px">${x.icon}</span></div>`).join('') || '<p class="mut sm" style="margin-bottom:12px">You have no listings yet. Tap Market, then Sell item.</p>'}
  <div class="card"><b class="mut sm">Confessions & identity</b>
    <div class="row sb" style="padding:10px 0"><div><b>Anonymous posting mode</b><div class="mut sm">Always post anonymously in confessions</div></div>${sw('anon', pf.anon)}</div>
    <div class="row sb"><div><b>WhatsApp marketplace</b><div class="mut sm">${esc(u.phone || 'Number added when you list an item')}</div></div>${sw('waVisible', pf.waVisible)}</div></div>
  <div class="card"><b class="mut sm">Push notifications</b>${['exam','gist','buyer'].map(ck).join('')}</div>
  <button class="card" id="out" style="width:100%;color:var(--red);font-weight:700;background:rgba(244,63,94,.08)">Sign out</button>
  <p class="mut sm" style="text-align:center">CampusX v0.2 • Nigerian Campus Network</p>`;
}

/* ============ 4. RENDER + EVENTS ============ */
const screens = {feed, market, academics, profile};
const tabs = [['feed','Feed','dynamic_feed'], ['market','Market','shopping_bag'], ['academics','Academics','school'], ['profile','Profile','badge']];
function authScreen() {
  const reg = ui.authMode === 'register';
  return `<div class="card" style="margin-top:24px"><h1 style="font-size:26px">${reg ? 'Join CampusX' : 'Welcome back'}</h1>
  <p class="mut" style="margin:4px 0 16px">${reg ? 'Create your student account.' : 'Log in to continue.'}</p>
  <div style="display:grid;gap:10px">${reg ? '<input id="a-name" placeholder="Full name"><input id="a-handle" placeholder="Handle e.g. tunde_x">' : ''}
  <input id="a-email" type="email" placeholder="Email"><input id="a-pass" type="password" placeholder="Password (8+ characters)">
  <p id="a-err" class="sm" style="color:var(--red)"></p><button class="btn" id="a-go">${reg ? 'Create account' : 'Log in'}</button>
  <button class="mut sm" id="a-switch">${reg ? 'Have an account? Log in' : 'New here? Create an account'}</button></div></div>`;
}
async function render() {
  const authed = !!token.get();
  $('#nav').style.display = authed ? '' : 'none';
  if (!authed) { $('#app').innerHTML = authScreen(); return; }
  $('#nav').innerHTML = tabs.map(t => `<button class="${ui.tab===t[0]?'on':''}" data-tab="${t[0]}">${ico(t[2])}${t[1]}</button>`).join('');
  const keep = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  try { $('#app').innerHTML = await screens[ui.tab](); }
  catch (e) { $('#app').innerHTML = `<div class="card"><b class="h">Can't load this screen</b><p class="mut sm">${esc(e.message)}. Check that node server.js is still running.</p></div>`; return; }
  if (keep && $('#' + keep)) { const el = $('#' + keep); el.focus(); if (pos != null && el.setSelectionRange) try { el.setSelectionRange(pos, pos) } catch {} }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button, .opt'); if (!t) return;
  const d = t.dataset;
  if (d.tab) { ui.tab = d.tab; scrollTo(0, 0) }
  else if (d.filter) ui.feedFilter = d.filter;
  else if (t.id === 'incog') ui.incognito = !ui.incognito;
  else if (t.id === 'post') {
    const box = $('#compose'), text = box.value.trim();
    if (!text) return toast('Write something first');
    await api.addPost({text, anon: ui.incognito || prefs.get().anon});
    toast('Posted');
  }
  else if (d.vote != null) await api.vote(+d.poll, +d.vote);
  else if (d.like) await api.likePost(+d.like);
  else if (d.cat) ui.cat = d.cat;
  else if (t.id === 'sell') {
    const s = sheet(`<h2>Sell an item</h2><input id="f-title" placeholder="What are you selling?"><input id="f-price" type="number" placeholder="Price in ₦"><input id="f-wa" placeholder="WhatsApp number e.g. 2348012345678"><select id="f-cat"><option>Phones</option><option>Laptops</option><option>Books</option><option>Hostel</option></select><button class="btn lime" id="f-go">Publish listing</button>`);
    s.querySelector('#f-go').onclick = async () => {
      const title = s.querySelector('#f-title').value.trim(), price = +s.querySelector('#f-price').value, phone = s.querySelector('#f-wa').value.replace(/\D/g, '');
      if (!title || !price || phone.length < 10) return toast('Fill in all three fields');
      const cat = s.querySelector('#f-cat').value, icon = {Phones:'📱', Laptops:'💻', Books:'📚', Hostel:'🏠'}[cat];
      await api.addListing({title, price, cat, phone, icon, location: 'UNILAG'});
      s.remove(); toast('Listing published'); render();
    };
    return;
  }
  else if (t.id === 'addc') {
    const s = sheet(`<h2>Add course</h2><input id="c-code" placeholder="Course code e.g. CPE 507"><input id="c-name" placeholder="Course title"><button class="btn lime" id="c-go">Add course</button>`);
    s.querySelector('#c-go').onclick = async () => {
      const code = s.querySelector('#c-code').value.trim(); if (!code) return toast('Enter a course code');
      const c = await api.courses(); c.push({code, name: s.querySelector('#c-name').value.trim() || 'New course', unit: 2, grade: 5});
      await api.saveCourses(c); s.remove(); render();
    };
    return;
  }
  else if (d.del != null) { const c = await api.courses(); c.splice(+d.del, 1); await api.saveCourses(c) }
  else if (t.id === 'reset') await api.saveCourses([]);
  else if (d.dl) return toast('Download starts when your backend serves files');
  else if (d.sw) { const p = prefs.get(); p[d.sw] = !p[d.sw]; prefs.set(p) }
  else if (t.id === 'edit') {
    const u = await api.me();
    const s = sheet(`<h2>Edit profile</h2><input id="e-name" value="${esc(u.name)}"><textarea id="e-bio" rows="3" style="background:var(--s1);padding:11px 12px;border:1px solid var(--line);border-radius:12px">${esc(u.bio)}</textarea><button class="btn lime" id="e-go">Save changes</button>`);
    s.querySelector('#e-go').onclick = async () => { u.name = s.querySelector('#e-name').value.trim() || u.name; u.bio = s.querySelector('#e-bio').value.trim(); await api.saveMe({name: u.name, bio: u.bio}); s.remove(); toast('Saved changes'); render() };
    return;
  }
  else if (t.id === 'out') { token.clear(); toast('Signed out') }
  else if (t.id === 'a-switch') ui.authMode = ui.authMode === 'register' ? 'login' : 'register';
  else if (t.id === 'a-go') {
    const v = id => $('#' + id)?.value.trim(), pass = $('#a-pass').value;
    try {
      const r = ui.authMode === 'register' ? await api.register({name: v('a-name'), handle: v('a-handle'), email: v('a-email'), password: pass}) : await api.login(v('a-email'), pass);
      token.set(r.token); ui.tab = 'feed';
    } catch (err) { $('#a-err').textContent = err.message; return; }
  }
  else if (t.id === 'campus') return toast('More campuses coming soon');
  else return;
  render();
});

document.addEventListener('input', e => {
  if (e.target.id === 'msearch') { ui.q = e.target.value; render() }
  if (e.target.id === 'psearch') { ui.pq = e.target.value; render() }
});
document.addEventListener('change', async e => {
  const d = e.target.dataset;
  if (d.unit != null || d.grade != null) {
    const c = await api.courses(), i = +(d.unit ?? d.grade);
    if (d.unit != null) c[i].unit = +e.target.value; else c[i].grade = +e.target.value;
    await api.saveCourses(c); render();
  }
  if (d.ck) { const p = prefs.get(); p.notif[d.ck] = e.target.checked; prefs.set(p) }
});
window.addEventListener('unhandledrejection', e => toast(e.reason?.message || 'Something went wrong'));
render();
</script>
</body>
</html>
